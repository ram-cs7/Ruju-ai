<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ruju.ai</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 300px;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }
    h1 {
      font-size: 16px;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 svg { color: #2563eb; }
    p { font-size: 13px; color: #475569; margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 12px; font-size: 12px; color: #166534; text-align: center; display: none; }
  </style>
</head>
<body>
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    Ruju.ai
  </h1>
  <p>Set your API key and target Document ID to enable highlight-to-verify on any webpage.</p>
  
  <label for="apiKey">API Key (Bearer Token)</label>
  <input type="password" id="apiKey" placeholder="rj_..." />
  
  <label for="documentId">Target Document ID</label>
  <input type="text" id="documentId" placeholder="cm..." />
  
  <button id="saveBtn">Save Settings</button>
  <div id="status">Settings saved!</div>

  <script src="popup.js"></script>
</body>
</html>
